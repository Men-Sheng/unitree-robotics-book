<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direction B - 机械芭蕾 - 关键帧</title>
<style>
body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = 1920;
canvas.height = 1080;

// 粒子系统
class Particle {
  constructor(x, y, vx, vy, color, life) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.color = color;
    this.life = life;
    this.maxLife = life;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.5;
  }

  draw() {
    const alpha = this.life / this.maxLife;
    ctx.fillStyle = this.color.replace('1)', alpha + ')');
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];

// 渲染镜头 4 的关键帧：电机内部粒子流
function draw() {
  // 背景
  ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
  ctx.fillRect(0, 0, 1920, 1080);

  const cx = 960;
  const cy = 540;

  // 生成螺旋粒子
  for (let i = 0; i < 30; i++) {
    const angle = (Date.now() / 500 + i * 0.3) % (Math.PI * 2);
    const radius = 150 + Math.sin(angle * 3) * 50;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    const vx = -Math.sin(angle) * 2;
    const vy = Math.cos(angle) * 2;
    particles.push(new Particle(x, y, vx, vy, 'rgba(99, 102, 241, 1)', 60));
  }

  // 生成向外辐射的粒子
  if (particles.length < 3000) {
    for (let i = 0; i < 10; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 3;
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      particles.push(new Particle(cx, cy, vx, vy, 'rgba(251, 191, 36, 1)', 80));
    }
  }

  // 更新和绘制粒子
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.update();
    p.draw();
  });

  // 绘制电机转子轮廓
  ctx.strokeStyle = '#6366f1';
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx, cy, 200, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 120, 0, Math.PI * 2);
  ctx.stroke();

  // 旋转的磁场线
  ctx.globalAlpha = 0.8;
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 + (Date.now() / 1000);
    const x1 = cx + Math.cos(angle) * 80;
    const y1 = cy + Math.sin(angle) * 80;
    const x2 = cx + Math.cos(angle) * 200;
    const y2 = cy + Math.sin(angle) * 200;

    const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
    gradient.addColorStop(0, 'rgba(139, 92, 246, 1)');
    gradient.addColorStop(1, 'rgba(139, 92, 246, 0)');

    ctx.strokeStyle = gradient;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  // 中心能量球
  const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, 100);
  gradient.addColorStop(0, 'rgba(251, 191, 36, 1)');
  gradient.addColorStop(0.3, 'rgba(251, 191, 36, 0.8)');
  gradient.addColorStop(0.7, 'rgba(251, 191, 36, 0.2)');
  gradient.addColorStop(1, 'rgba(251, 191, 36, 0)');
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, 100, 0, Math.PI * 2);
  ctx.fill();

  // 核心点
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI * 2);
  ctx.fill();

  // 外圈辉光
  ctx.globalAlpha = 0.2;
  const outerGlow = ctx.createRadialGradient(cx, cy, 200, cx, cy, 400);
  outerGlow.addColorStop(0, 'rgba(99, 102, 241, 0.4)');
  outerGlow.addColorStop(1, 'rgba(99, 102, 241, 0)');
  ctx.fillStyle = outerGlow;
  ctx.beginPath();
  ctx.arc(cx, cy, 400, 0, Math.PI * 2);
  ctx.fill();

  // 文字标注
  ctx.globalAlpha = 1;
  ctx.font = 'bold 56px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'right';
  ctx.fillText('永磁同步电机', 1700, 350);

  ctx.font = '36px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#6366f1';
  ctx.fillText('低惯量内转子', 1700, 420);
  ctx.fillText('双编码器', 1700, 470);

  // 技术参数
  ctx.font = '28px "Noto Sans SC", sans-serif';
  ctx.fillStyle = '#8b5cf6';
  ctx.globalAlpha = 0.8;
  ctx.fillText('HIGH-SPEED ROTATION', 1700, 560);
  ctx.fillText('MAGNETIC FIELD VISUALIZATION', 1700, 610);

  requestAnimationFrame(draw);
}

// 清空画布并开始
ctx.fillStyle = '#000';
ctx.fillRect(0, 0, 1920, 1080);
draw();
</script>
</body>
</html>
